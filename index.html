<!doctype html>
<html lang="en">
  <script src="https://res.zvo.cn/translate/translate.js"></script>
  <head>
    <meta charset="UTF-8" />
    <!-- Primary Meta Tags -->
    <title>Squish - Batch Browser-based Image Compression</title>
    <meta name="title" content="Squish - Browser-based Image Compression">
    <meta name="description" content="Fast, efficient batch image compression right in your browser. Supports AVIF, JPEG, JXL, PNG, and WebP formats with adjustable quality settings.">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/image-128x128.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/image-512x512.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/image-512x512.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://squish.addy.ie">
    <meta property="og:title" content="Squish - Batch Browser-based Image Compression">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://squish.addy.ie">
    <meta property="twitter:title" content="Squish - Batch Browser-based Image Compression">
    <meta property="twitter:description" content="Fast, efficient batch image compression right in your browser. Supports AVIF, JPEG, JXL, PNG, and WebP formats with adjustable quality settings.">

    <!-- Theme Color -->
    <meta name="theme-color" content="#18181b">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- === 1. 样式 === -->
<style>
  .nav-header-btn {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 5px !important;
    height: 32px !important;
    padding: 0 12px !important;
    background: rgba(255, 255, 255, 0.9) !important;
    border: 1px solid rgba(0, 0, 0, 0.15) !important;
    border-radius: 8px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: #1f2937 !important;
    text-decoration: none !important;
    cursor: pointer !important;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1) !important;
    box-sizing: border-box !important;
    line-height: 1 !important;
    white-space: nowrap !important;
  }
  .nav-header-btn:hover { background: #ffffff !important; }
</style>

<!-- === 2. 悬浮组件与驱动 === -->
<script>
  (function() {
    function initTranslate() {
      if (typeof translate === 'undefined') {
        setTimeout(initTranslate, 50);
        return;
      }
      translate.selectLanguageTag.show = false;
      translate.service.use('client.edge');
      translate.execute();

      if (document.getElementById('lang-dropdown-wrapper')) return;

      const wrapper = document.createElement('div');
      wrapper.id = 'lang-dropdown-wrapper';
      wrapper.style.cssText = 'position:fixed;top:16px;right:20px;z-index:999999;display:inline-flex;align-items:center;gap:8px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;';
      wrapper.innerHTML = `
        <a href="https://walter19821015.ccwu.cc" class="nav-header-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>首页</span>
        </a>
        <div style="position:relative;display:inline-flex;align-items:center;">
          <button id="langMenuBtn" type="button" class="nav-header-btn">
            <span>🌐 语言</span>
            <span style="font-size:10px;opacity:0.7;">▼</span>
          </button>
          <div id="langMenu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);width:120px;background:#ffffff;border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,0.15);border:1px solid #e5e7eb;overflow:hidden;z-index:999999;padding:4px 0;">
            <a href="javascript:translate.changeLanguage('chinese_simplified');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">简体中文</a>
            <a href="javascript:translate.changeLanguage('english');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">English</a>
            <a href="javascript:translate.changeLanguage('spanish');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">Español</a>
            <a href="javascript:translate.changeLanguage('arabic');" style="display:block;padding:8px 14px;color:#374151;font-size:13px;text-decoration:none;">العربية</a>
          </div>
        </div>
      `;
      document.body.appendChild(wrapper);

      const btn = document.getElementById('langMenuBtn');
      const menu = document.getElementById('langMenu');
      btn.onclick = function(e) {
        e.stopPropagation();
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
      };
      document.addEventListener('click', function(e) {
        if (!wrapper.contains(e.target)) menu.style.display = 'none';
      });
      menu.onclick = function() { menu.style.display = 'none'; };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initTranslate);
    } else {
      initTranslate();
    }
  })();
</script>
  </body>
</html>
